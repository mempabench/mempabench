name: mempa-mem0

# The Qdrant that `mem0` and `simple_rag` write to. It is deliberately its own
# instance and not the one inside `deploy/memos/compose.yaml`: that one is on
# the `mempa-memos-network` at host port 6433 and belongs to MemOS, while
# `qdrant_host`/`qdrant_port` are recorded in each run's `run_plan.yaml`, so
# sharing one endpoint between two conditions would leave their plans unclear
# about what they ran against.
#
# Host port 6333 and the image tag are the values the orchestrator already
# records: `_qdrant_endpoint_from_environment` defaults to `127.0.0.1:6333`
# (`scripts/run_orchestrator.py:722-740`) and the pinned image is
# `qdrant/qdrant:v1.15.3` (`scripts/run_orchestrator.py:652`).

services:
  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: mempa-mem0-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MEM0_QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${MEM0_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - mem0_qdrant_data:/qdrant/storage
      - mem0_qdrant_snapshots:/qdrant/snapshots
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c ': >/dev/tcp/127.0.0.1/6333'"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  mem0_qdrant_data:
  mem0_qdrant_snapshots:
