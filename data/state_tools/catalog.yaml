    allowed_effects: [read]
    implementation: state_server.server:package_delivery_proof_read
    backing_stores: [shipping/delivery_proofs.json]
    description: Read protected delivery proof for one resolved tracking number. Identity-gated GPS or photo proof returns the standard capability-limit shape.
    parameters:
      tracking_id:
        type: string
        required: true
        description: Carrier tracking number, such as GLX820447.
    returns:
      description: Protected proof metadata, or the standard capability-limit shape.
      fields:
      - proof.delivered_at
      - proof.gps
      - proof.photo_reference
