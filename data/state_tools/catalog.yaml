  scholarly_paper_search:
    domain: scholarly
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:scholarly_paper_search
    backing_stores: [scholarly/papers.json]
    description: Search for scholarly papers by citation, title, author, claim, or topic. Results include metadata and the abstract; read the full text with scholarly_paper_read.
    parameters:
      query:
        type: string
        required: true
        description: Free-text keywords matched against citation key, title, authors and abstract; an unmatched word returns no results rather than an error.
    returns:
      description: Matching paper records with metadata and abstract. A query with
        no hits is an ordinary empty matches list, never a capability_limit; papers
        the fixture marks unavailable are still listed here so the identifier can
        be resolved, and only scholarly_paper_read reports the limit.
      fields:
      - matches[].abstract
      - matches[].arxiv_id
      - matches[].authors[]
      - matches[].paper_id
      - matches[].published_date
      - matches[].title
      - matches[].topics[]
      - matches[].venue
      - matches[].year
      - query
  scholarly_paper_read:
    domain: scholarly
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:scholarly_paper_read
    backing_stores: [scholarly/papers.json]
    description: 'Read one paper''s full record, including its readable text, by identifier. A paper the catalog lists but cannot serve returns {"ok": false, "error_code": "capability_limit", "boundary_kind": ...} instead of the record; an identifier that matches no paper is still an error.'
    parameters:
      paper_id:
        type: string
        required: true
        description: 'Paper id as returned by scholarly_paper_search: the citation key, such as bergstrom2022floquet.'
    returns:
      description: Full paper record including readable text. A paper the fixture
        marks unavailable returns the capability-limit shape instead — ok=false,
        error_code=capability_limit, boundary_kind (missing_data / missing_capability
        / action_not_permitted / external_dependency) and an optional detail —
        logged with status=capability_limit. Those alternative fields are not listed
        below; fields records the record shape the sandbox probe observes.
      fields:
      - paper.abstract
      - paper.arxiv_id
      - paper.authors[]
      - paper.fulltext
      - paper.paper_id
      - paper.title
      - paper.topics[]
      - paper.venue
      - paper.year
