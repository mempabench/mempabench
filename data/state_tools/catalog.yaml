  media_transcode_service_search:
    domain: media_transcode
    layer: persona:user_c
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:media_transcode_service_search
    backing_stores: [media_transcode/services.json]
    description: Search published professional media-transcode offers that accept a source format, deliver the requested target format, and promise delivery by a date.
    parameters:
      source_format:
        type: string
        required: true
        description: Source format as the source manifest names it.
      target_format:
        type: string
        required: true
        description: Required target format, such as mp4/H.264.
      deliver_by:
        type: string
        required: true
        description: Latest acceptable delivery date, YYYY-MM-DD.
    returns:
      description: Viable offers with their exact fee, promise, and source-locator requirement.
      fields:
      - deliver_by
      - matches[].currency
      - matches[].delivery_terms
      - matches[].fee
      - matches[].promised_delivery_at
      - matches[].provider
      - matches[].required_source_locator
      - matches[].service_id
      - matches[].source_manifest_path
      - source_format
      - target_format
  media_transcode_job_create:
    domain: media_transcode
    layer: persona:user_c
    status: implemented
    allowed_effects: [external_write]
    implementation: state_server.server:media_transcode_job_create
    backing_stores: [media_transcode/jobs.jsonl, media_transcode/services.json, media_transcode/artifacts.json, finance/payment_methods.json]
    description: Accept and pay for an authorized professional transcode commission. The service atomically validates the existing source and saved payment method, captures the published fee, and delivers its verified artifact. This is an external action.
    parameters:
      service_id:
        type: string
        required: true
        description: Service id such as mts_rapidframe_realtime returned by media_transcode_service_search.
      source_path:
        type: string
        required: true
        description: Existing run-state-relative media path named by the source manifest; the service verifies its SHA-256.
      target_format:
        type: string
        required: true
        description: Target format offered by the service, such as mp4/H.264.
      deliver_by:
        type: string
        required: true
        description: Latest acceptable delivery date, YYYY-MM-DD.
      payment_method_id:
        type: string
        required: true
        description: Saved payment method id from payment_method_read, pm_*.
    returns:
      description: Accepted commission, captured charge, and delivered artifact binding.
      fields:
      - artifact.artifact_id
      - artifact.container
      - artifact.job_id
      - artifact.path
      - artifact.sha256
      - artifact.size_bytes
      - artifact.source_sha256
      - artifact.video_codec
      - charge.amount
      - charge.charge_id
      - charge.charged_at
      - charge.currency
      - charge.payment_method_id
      - charge.status
      - job_id
      - status
  media_transcode_job_read:
    domain: media_transcode
    layer: persona:user_c
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:media_transcode_job_read
    backing_stores: [media_transcode/jobs.jsonl]
    description: Read one persisted professional transcode commission, captured charge, and immutable delivered-artifact manifest. This call never advances a job.
    parameters:
      job_id:
        type: string
        required: true
        description: Transcode job id returned by media_transcode_job_create, mtj_NNNN.
    returns:
      description: Full persisted job, charge, and artifact manifest.
      fields:
      - job.accepted_at
      - job.artifact.artifact_id
      - job.artifact.container
      - job.artifact.job_id
      - job.artifact.path
      - job.artifact.sha256
      - job.artifact.size_bytes
      - job.artifact.source_sha256
      - job.artifact.video_codec
      - job.charge.amount
      - job.charge.charge_id
      - job.charge.charged_at
      - job.charge.currency
      - job.charge.payment_method_id
      - job.charge.status
      - job.deliver_by
      - job.delivered_at
      - job.job_id
      - job.provider
      - job.service_id
      - job.source_format
      - job.source_path
      - job.status
      - job.target_format
  household_inventory_search:
    domain: household
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:household_inventory_search
    backing_stores: [household/inventory.json]
    description: Check whether a household location contains a usable item.
    parameters:
      location:
        type: string
        required: true
        description: Place in the home as the inventory names it, matched as a substring of the stored location, such as 'hall closet'; an unknown value is a tool error that lists the known ones.
      item:
        type: string
        required: true
        description: Item to look for, matched as free text.
    returns:
      description: Matching household inventory records and whether a usable item exists.
      fields:
      - item
      - location
      - matches[].id
      - matches[].item
      - matches[].location
      - matches[].notes
      - matches[].quantity
      - matches[].usable
      - usable_item_available
