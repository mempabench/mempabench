  package_tracking_read:
    domain: shipping
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:package_tracking_read
    backing_stores: [shipping/tracking.json]
    description: 'Read the scan-event history and latest status for one package. A package the carrier lists but cannot serve returns {"ok": false, "error_code": "capability_limit", "boundary_kind": ...} instead of the record; a tracking number that matches no package is still an error.'
    parameters:
      tracking_id:
        type: string
        required: true
        description: Carrier tracking number as printed in the shipping email or on the order record, such as GLX722480.
    returns:
      description: Carrier, scan events, and current status for the package. A package
        the fixture marks unavailable returns the capability-limit shape instead —
        ok=false, error_code=capability_limit, boundary_kind (missing_data / missing_capability
        / action_not_permitted / external_dependency) and an optional detail — logged
        with status=capability_limit. Those alternative fields are not listed below;
        fields records the record shape the sandbox probe observes.
      fields:
      - carrier
      - events[].date
      - events[].location
      - events[].status
      - events[].time
      - status
      - tracking_id
