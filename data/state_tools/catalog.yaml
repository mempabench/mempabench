schema_version: 3
scope: project
resource_scope: current_run
# World Toolbox
# - layer: core = persona-independent Layer 1; persona:<id> = Layer 2 extension
# - every handler is a real function over the run-local stores in backing_stores
# - no scripted cases, no call-count logic; writes persist, readbacks read real state
tools:
  email_message_search:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:email_message_search
    backing_stores: [email/inbox.jsonl]
    description: Search the run-local email inbox by keyword. Use this when the task asks the PA to find an email or recover details from email.
    parameters:
      query:
        type: string
        required: true
        description: Free-text keywords matched against sender, subject and body; an unmatched word returns no results rather than an error.
    returns:
      description: Matching email identifiers, metadata, and snippets.
      fields:
      - matches[].date
      - matches[].from
      - matches[].id
      - matches[].snippet
      - matches[].subject
      - query
  email_message_read:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:email_message_read
    backing_stores: [email/inbox.jsonl]
    description: Read the full body of an inbox email by id after email_message_search returns a match.
    parameters:
      email_id:
        type: string
        required: true
        description: Inbox email id as returned by email_message_search, em_NNNN.
    returns:
      description: Full email metadata and body.
      fields:
      - body
      - date
      - from
      - id
      - subject
      - to
  email_draft_create:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:email_draft_create
    backing_stores: [email/drafts.jsonl]
    description: Save a PA-authored email draft. Pass draft_id to revise an existing draft in place; omit it to create a new draft. Optional attachments must be run-state-relative paths.
    parameters:
      to:
        type: string
        required: true
        description: One recipient, or multiple recipients separated by commas, each as an email address or a name; stored verbatim and never resolved against the address book.
      subject:
        type: string
        required: true
        description: Subject line.
      body:
        type: string
        required: true
        description: Full body text of the draft. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it.
      attachments:
        type: array
        items: {type: string}
        required: false
        description: Document paths relative to the task state.
      draft_id:
        type: string
        required: false
        description: Draft id as returned by an earlier email_draft_create, draft_NNNN; omit to create a new draft.
    returns:
      description: Draft identifier and saved or updated status.
      fields:
      - draft_id
      - status
  email_draft_read:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:email_draft_read
    backing_stores: [email/drafts.jsonl]
    description: Read one saved email draft by identifier.
    parameters:
      draft_id:
        type: string
        required: true
        description: Draft id as returned by email_draft_create, draft_NNNN.
    returns:
      description: Full draft content and metadata.
      fields:
      - attachments[]
      - body
      - draft_id
      - subject
      - to
  email_message_send:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [external_write]
    implementation: state_server.server:email_message_send
    backing_stores: [email/sent.jsonl]
    description: 'Send an email from the current MemPABench run state. This is an external action: use it only when the user has authorized sending. Optional attachments must be run-state-relative paths.'
    parameters:
      to:
        type: string
        required: true
        description: Recipient, as an email address or a name; stored verbatim and never resolved against the address book.
      subject:
        type: string
        required: true
        description: Subject line.
      body:
        type: string
        required: true
        description: Full body text of the email. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it.
      attachments:
        type: array
        items: {type: string}
        required: false
        description: Document paths relative to the task state.
    returns:
      description: Sent-message identifier and status.
      fields:
      - sent_id
      - status
  email_sent_read:
    domain: email
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:email_sent_read
    backing_stores: [email/sent.jsonl]
    description: Read one persisted sent-email record by identifier.
    parameters:
      sent_id:
        type: string
        required: true
        description: Sent-email id as returned by email_message_send, sent_NNNN.
    returns:
      description: Full sent-email content and metadata.
      fields:
      - attachments[]
      - body
      - sent_at
      - sent_id
      - subject
      - to
  message_send:
    domain: message
    layer: core
    status: implemented
    allowed_effects: [external_write]
    implementation: state_server.server:message_send
    backing_stores: [message/threads.jsonl]
    description: 'Send an informal text message to a personal contact. This is an external action: use it only when appropriate and authorized. Use email for formal or institutional correspondence.'
    parameters:
      to:
        type: string
        required: true
        description: Contact name or handle; stored verbatim and never resolved against the address book.
      body:
        type: string
        required: true
        description: Message text. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it.
    returns:
      description: Message identifier and sent status.
      fields:
      - message_id
      - status
  message_search:
    domain: message
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:message_search
    backing_stores: [message/threads.jsonl]
    description: Search text-message history by keyword or contact.
    parameters:
      query:
        type: string
        required: true
        description: Free-text keywords matched against the contact and the message text; an unmatched word returns no results rather than an error.
    returns:
      description: Matching message identifiers, contacts, dates, and snippets.
      fields:
      - matches[].date
      - matches[].direction
      - matches[].message_id
      - matches[].snippet
      - matches[].with
      - query
  message_read:
    domain: message
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:message_read
    backing_stores: [message/threads.jsonl]
    description: Read one text message by identifier.
    parameters:
      message_id:
        type: string
        required: true
        description: Message id as returned by message_search or message_send, msg_NNNN.
    returns:
      description: Full message record.
      fields:
      - body
      - date
      - direction
      - message_id
      - with
  calendar_event_search:
    domain: calendar
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:calendar_event_search
    backing_stores: [calendar/events.json]
    description: Search the current run calendar by task, participant, or purpose. Results include personal events and world events such as holidays.
    parameters:
      query:
        type: string
        required: true
        description: Free-text keywords matched against title, location, notes and participants; an unmatched word returns no results rather than an error.
      date:
        type: string
        required: false
        description: Optional date filter, YYYY-MM-DD.
    returns:
      description: Matching calendar events with time, location, and participants.
      fields:
      - date
      - matches[]
      - matches[].created_date
      - matches[].date
      - matches[].end_date
      - matches[].end_time
      - matches[].event_id
      - matches[].location
      - matches[].notes
      - matches[].participants[]
      - matches[].recurrence
      - matches[].scope
      - matches[].start_time
      - matches[].status
      - matches[].title
      - query
  calendar_event_read:
    domain: calendar
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:calendar_event_read
    backing_stores: [calendar/events.json]
    description: Read one calendar event by identifier.
    parameters:
      event_id:
        type: string
        required: true
        description: Event id as returned by calendar_event_search, ev_NNNN.
    returns:
      description: Full event record.
      fields:
      - event.created_date
      - event.date
      - event.end_date
      - event.end_time
      - event.event_id
      - event.location
      - event.notes
      - event.participants[]
      - event.recurrence
      - event.scope
      - event.start_time
      - event.status
      - event.title
  calendar_event_create:
    domain: calendar
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:calendar_event_create
    backing_stores: [calendar/events.json]
    description: Create one calendar event or recurring series.
    parameters:
      title:
        type: string
        required: true
        description: Event title as it appears on the calendar.
      date:
        type: string
        required: true
        description: Event date, YYYY-MM-DD (first occurrence of a series).
      start_time:
        type: string
        required: false
        description: Start time, 24-hour HH:MM.
      end_time:
        type: string
        required: false
        description: End time, 24-hour HH:MM.
      location:
        type: string
        required: false
        description: Free-text place, such as a room or address.
      participants:
        type: array
        items: {type: string}
        required: false
        description: Names or email addresses; stored verbatim and never resolved against the address book.
      recurrence:
        type: string
        required: false
        description: 'Recurrence phrase: ''daily'', ''yearly'', or ''weekly on <day names>'' such as ''weekly on Mondays and Wednesdays'', each optionally suffixed '' through YYYY-MM-DD''. For a one-off event omit this parameter or pass null.'
    returns:
      description: Created event identifier and status.
      fields:
      - event_id
      - status
  calendar_event_update:
    domain: calendar
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:calendar_event_update
    backing_stores: [calendar/events.json]
    description: Update or cancel one existing personal calendar event. World events such as holidays cannot be changed.
    parameters:
      event_id:
        type: string
        required: true
        description: Event id as returned by calendar_event_search, ev_NNNN.
      title:
        type: string
        required: false
        description: New event title.
      date:
        type: string
        required: false
        description: New date, YYYY-MM-DD.
      start_time:
        type: string
        required: false
        description: New start time, 24-hour HH:MM.
      end_time:
        type: string
        required: false
        description: New end time, 24-hour HH:MM.
      location:
        type: string
        required: false
        description: New free-text place, such as a room or address.
      participants:
        type: array
        items: {type: string}
        required: false
        description: Replacement list of names or email addresses; stored verbatim and never resolved against the address book.
      status:
        type: string
        required: false
        description: Either 'confirmed' or 'cancelled'.
      notes:
        type: string
        required: false
        description: New free-text note kept on the event, such as what changed and why; omitted leaves the existing note in place.
    returns:
      description: Updated event identifier and status.
      fields:
      - event_id
      - status
  copier_entitlement_read:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:copier_entitlement_read
    backing_stores: [copier/entitlements.json]
    description: Read one copier-contract entitlement by contract and component. A schedule the provider keeps in its portal returns the standard capability-limit shape.
    parameters:
      contract_id:
        type: string
        required: true
        description: Copier service contract id, ctr_*.
      component:
        type: string
        required: true
        description: Covered component, such as imaging drum.
    returns:
      description: The entitlement record, or the standard capability-limit shape when protected.
      fields:
      - entitlement.component
      - entitlement.contract_id
      - entitlement.coverage
  corporate_reporting_submit:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [external_write]
    implementation: state_server.server:corporate_reporting_submit
    backing_stores: [corporate/reporting_accounts.json, corporate/reporting_submissions.jsonl]
    description: Submit one ready run-state file through its configured corporate reporting account. This is an external action. A locked account returns the standard capability-limit shape and creates no submission.
    parameters:
      file_id:
        type: string
        required: true
        description: Run-state-relative path, such as documents/branch/monthly.csv.
    returns:
      description: Submission identifier and submitted status, or the standard capability-limit shape.
      fields:
      - status
      - submission_id
  document_read:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:document_read
    backing_stores: [documents/, my_desktop/]
    description: 'Read a document from the current MemPABench run state. Use this for task documents, not for interaction preferences. Paths are relative to the user''s task state: an empty path or ''.'' lists the top-level folders, a user reference like ''my desktop'' corresponds to the my_desktop/ folder, and the user''s working files (for example ''the research folder'' or ''the admin folder'') live under documents/. Use a path the user supplied or a prior task result surfaced. Do not browse unrelated directories to discover task inputs the user has not identified. This state holds only the user''s task documents; your own memory and skills files are not here, so paths like memory/MEMORY.md are not readable through this tool.'
    parameters:
      path:
        type: string
        required: true
        description: Document path relative to the task state, such as 'documents/research/draft_intro.md' or 'my_desktop/notes.md'. Empty or '.' lists the top-level folders.
    returns:
      description: File content or a directory file listing with the resolved relative path.
      fields:
      - bytes
      - content
      - files[]
      - path
      - type
  document_create:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:document_create
    backing_stores: [documents/, my_desktop/]
    description: Create a new document in the current MemPABench run state. Use this only when the task needs a file that does not exist yet. If the path already exists nothing is written and the result reports status 'exists'; edit that file with document_update instead.
    parameters:
      path:
        type: string
        required: true
        description: Path for the new document, relative to the task state, including the file extension.
      content:
        type: string
        required: true
        description: Full text of the new document. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it.
    returns:
      description: Resolved path, created or exists status, and byte count.
      fields:
      - bytes
      - path
      - status
  document_update:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:document_update
    backing_stores: [documents/, my_desktop/]
    description: 'Edit an existing document in the current MemPABench run state. ''anchor'' is an exact substring of the document''s current text that must occur exactly once; it is replaced by ''replacement''. Read the document first and copy the anchor as plain text: document_read returns JSON, so the \n and \" sequences in its output are JSON escapes, not document text — send real newlines and plain quotes, never a backslash. Prefer a short single-line anchor, and do not let one span a blank line. The rest of the file is left untouched. Fails if the file does not exist or the anchor is missing or ambiguous. This state holds only the user''s task documents; your own memory and skills files are not here, so paths like memory/MEMORY.md are not writable through this tool.'
    parameters:
      path:
        type: string
        required: true
        description: Path of the existing document to edit.
      anchor:
        type: string
        required: true
        description: 'Exact substring of the document''s current text, copied verbatim, occurring exactly once. Send it as plain text: real newlines and plain quotes, never the \n or \" JSON escapes that appear in document_read output. Keep it short, ideally a single line, and do not let it span a blank line. Never a bare heading line on its own — anchor on a content line under the heading, or on the heading plus its first content line.'
      replacement:
        type: string
        required: true
        description: Text that replaces the anchor. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it. An empty string deletes the anchored text; use it only to remove a whole entry or line you have read back, and never leave an unmatched fence or heading behind.
    returns:
      description: Resolved path, updated status, resulting byte count, and
        match_tier — which rung of the anchor ladder matched the span (exact,
        unescaped, or whitespace).
      fields:
      - bytes
      - match_tier
      - note
      - path
      - status
  document_delete:
    domain: documents
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:document_delete
    backing_stores: [documents/, my_desktop/]
    description: Delete an existing document from the current MemPABench run state. Use this only when the user's task calls for removing a file. Fails if it is missing.
    parameters:
      path:
        type: string
        required: true
        description: Path of the existing document to delete.
    returns:
      description: Resolved path and deleted status.
      fields:
      - path
      - status
  contact_search:
    domain: contacts
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:contact_search
    backing_stores: [contacts.json]
    description: Look up contacts or external handoff channels by query. Use this when a task needs the right person, office, or channel to continue.
    parameters:
      query:
        type: string
        required: true
        description: Free-text keywords matched against name, organization, relation and notes; an unmatched word returns no results rather than an error.
    returns:
      description: Ranked matching contact records.
      fields:
      - matches[].contact_id
      - matches[].email
      - matches[].name
      - matches[].notes
      - matches[].organization
      - matches[].phone
      - matches[].relation
      - matches[].tags[]
      - query
  contact_read:
    domain: contacts
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:contact_read
    backing_stores: [contacts.json]
    description: 'Read one contact by identifier. A contact the address book lists but cannot serve returns {"ok": false, "error_code": "capability_limit", "boundary_kind": ...} instead of the record; an identifier that matches no contact is still an error.'
    parameters:
      contact_id:
        type: string
        required: true
        description: Contact id as returned by contact_search, ct_NNNN.
    returns:
      description: Full contact record. A contact the fixture marks unavailable
        returns the capability-limit shape instead — ok=false, error_code=capability_limit,
        boundary_kind (missing_data / missing_capability / action_not_permitted /
        external_dependency) and an optional detail — logged with status=capability_limit.
        Those alternative fields are not listed below; fields records the record
        shape the sandbox probe observes.
      fields:
      - contact.contact_id
      - contact.email
      - contact.name
      - contact.notes
      - contact.organization
      - contact.phone
      - contact.relation
      - contact.tags[]
  contact_create:
    domain: contacts
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:contact_create
    backing_stores: [contacts.json]
    description: Save a new contact in the current run state.
    parameters:
      name:
        type: string
        required: true
        description: Full name of the contact.
      email:
        type: string
        required: false
        description: Email address.
      phone:
        type: string
        required: false
        description: Phone number.
      organization:
        type: string
        required: false
        description: Employer, department or institution.
      relation:
        type: string
        required: false
        description: How the user knows them, such as 'collaborator' or 'landlord'.
      notes:
        type: string
        required: false
        description: Free-text notes.
    returns:
      description: Created contact identifier and status.
      fields:
      - contact_id
      - status
  contact_update:
    domain: contacts
    layer: core
    status: implemented
    allowed_effects: [internal_write]
    implementation: state_server.server:contact_update
    backing_stores: [contacts.json]
    description: Update one existing contact by identifier.
    parameters:
      contact_id:
        type: string
        required: true
        description: Contact id as returned by contact_search, ct_NNNN.
      name:
        type: string
        required: false
        description: New full name.
      email:
        type: string
        required: false
        description: New email address.
      phone:
        type: string
        required: false
        description: New phone number.
      organization:
        type: string
        required: false
        description: New employer, department or institution.
      relation:
        type: string
        required: false
        description: New relationship, such as 'collaborator' or 'landlord'.
      notes:
        type: string
        required: false
        description: New free-text notes.
    returns:
      description: Updated contact identifier and status.
      fields:
      - contact_id
      - status
  phone_call_dial:
    domain: phone
    layer: core
    status: implemented
    allowed_effects: [external_write]
    implementation: state_server.server:phone_call_dial
    backing_stores: [phone/calls.jsonl, contacts.json, places/nearby.json]
    description: 'Place a phone call to a number this world lists, for a contact or a place. This is an external action: use it only when appropriate and authorized. Get the number from contact_read or place_search first and pass it back as the listing writes it. A line the world cannot put through returns {"ok": false, "error_code": "capability_limit", "boundary_kind": ...} instead of a call; a number no listing carries is an error. When the line answers, the result reports who answered and what they said.'
    parameters:
      number:
        type: string
        required: true
        description: The number to dial, as the contact or place listing writes it; punctuation and spacing are ignored, so '(555) 026-2200' and '555-026-2200' reach the same line. A number no listing in this world carries is an error, not an unanswered call.
      purpose:
        type: string
        required: true
        description: What this call is about, said to whoever answers. When this is something the user must dictate, pass their own words; if the user has not given them, ask the user instead of composing it.
    returns:
      description: Call identifier, answered status, who answered, and what the line
        said when it has an answer on file. A number whose listing the fixture marks
        unavailable returns the capability-limit shape instead — ok=false,
        error_code=capability_limit, boundary_kind (missing_data / missing_capability
        / action_not_permitted / external_dependency) and an optional detail — logged
        with status=capability_limit. Those alternative fields are not listed below.
      fields:
      - answer
      - answered_by
      - call_id
      - number
      - status
  phone_call_read:
    domain: phone
    layer: core
    status: implemented
    allowed_effects: [read, verify]
    implementation: state_server.server:phone_call_read
    backing_stores: [phone/calls.jsonl]
    description: Read one call this run placed, by identifier.
    parameters:
      call_id:
        type: string
        required: true
        description: Call id as returned by phone_call_dial, call_NNNN.
    returns:
      description: Full record of one call this run placed.
      fields:
      - call.answer
      - call.answered_by
      - call.call_id
      - call.date
      - call.number
      - call.purpose
      - call.status
  club_closure_calendar_read:
    domain: maps_places
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:club_closure_calendar_read
    backing_stores: [places/closure_calendars.json]
    description: Read a club's dated closure calendar. A member-only calendar returns the standard capability-limit shape; ordinary weekly hours remain available through place_search.
    parameters:
      place_id:
        type: string
        required: true
        description: Stable place identifier from the world record, place_*.
      date_range:
        type: string
        required: true
        description: Requested date range, YYYY-MM-DD/YYYY-MM-DD.
    returns:
      description: The dated closure calendar, or the standard capability-limit shape when protected.
      fields:
      - calendar.closures[].date
      - calendar.closures[].status
      - calendar.date_range
      - calendar.place_id
  map_route_search:
    domain: maps_places
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:map_route_search
    backing_stores: [maps/route_options.json]
    description: Return route options with travel time and estimated price for a trip, optionally through an intermediate stop.
    parameters:
      origin:
        type: string
        required: true
        description: Start of the trip as a place name or address; matched against the route fixture by text, so use a name a place_search result or the user gave.
      destination:
        type: string
        required: true
        description: End of the trip, named the same way as origin.
      stop:
        type: string
        required: false
        default: ''
        description: Optional intermediate stop, named the same way; '' for none.
    returns:
      description: Matching route options with mode, travel time, and estimated price.
      fields:
      - destination
      - options[].duration_minutes
      - options[].estimated_price_usd
      - options[].mode
      - options[].summary
      - origin
      - stop
  place_search:
    domain: maps_places
    layer: core
    status: implemented
    allowed_effects: [read]
    implementation: state_server.server:place_search
    backing_stores: [places/nearby.json]
    description: Return nearby place options by location, category or name. Give at least one of them; they combine. Place records carry their own business hours, including dated holiday notices.
    parameters:
      location:
        type: string
        required: false
        description: Optional street or landmark near the user as the world names it, such as 'Civic Plaza' or 'Alder St', never a business or person name; an unknown value is a tool error that lists the known ones.
      category:
        type: string
        required: false
        description: Optional kind of place, matched against each record's category and tags. A category is one lowercase word, such as restaurant, cafe, grocery, cinema, exhibition, clinic or pharmacy; a world lists only the categories it actually contains, and an unknown value is a tool error that lists the known ones.
      query:
        type: string
        required: false
        description: Optional business or place name, such as 'Glenmont Pharmacy'; every whitespace-separated word has to appear in the listing's own name, case-insensitively. Use this when the user named the place; a name the world does not list simply returns no matches.
      limit:
        type: integer
        required: false
        default: 3
        description: Maximum number of places to return.
    returns:
      description: Matching nearby place records up to the requested limit.
      fields:
      - category
      - limit
      - location
      - matches[].address
      - matches[].category
      - matches[].hours.fri
      - matches[].hours.mon
      - matches[].hours.sat
      - matches[].hours.sun
      - matches[].hours.thu
      - matches[].hours.tue
      - matches[].hours.wed
      - matches[].name
      - matches[].near
      - matches[].notes
      - matches[].phone
      - matches[].place_id
      - matches[].price_band
      - matches[].published_date
      - matches[].tags[]
      - query
