    validated_roles: [pa]

# Upstream routing for a provider/model pair, sent as the request body's
# `provider` field (OpenRouter provider preferences). Kept apart from the
# policies above, so it never changes a policy snapshot or its sha256.
provider_routing:
  # Owner decision 2026-09-24: tencent/hy4-preview runs only on SiliconFlow,
  # which honors named/required tool_choice; no fallback to another upstream.
  # raw_response_log_dir (logging only): every PA call's raw upstream response
  # is appended to <workspace>/<dir>/<run_id>/raw_pa_responses.jsonl.
  - provider_name: openrouter
    model: tencent/hy4-preview
    order: [SiliconFlow]
    allow_fallbacks: false
    raw_response_log_dir: logs/raw_pa
