meta:
  persona: user_a
  range: acc_015-015
  model: openai/gpt-5.5
  temperature: 0.0
  seed: 20260512
  active_session_count: 1
evolving_map:
  work_autonomy_level:
    target_cell: work_autonomy_level
    pre_setting: Self-directed
    post_setting: Reactive
sessions:
- story:
    domain: collaborator_coordination
    story_id: reyes_afternoon_handoff
    errand_id: w3_send_section_to_reyes
    documents:
    - documents/research/draft_section3_w_notes.md
    key_terms:
    - Section 3 — Pathway classification and results (working draft)
    date: '2026-10-07'
    hour: 14
    time_position: early_oct
  task:
    user_goal: Get the current section ready for Reyes's review with the user's caveat included
      in the handoff email.
    completion_condition: A review email draft to Prof. Reyes is ready with the current section
      and the user's caveat, pending approval before it goes out.
    background: 'The prior section handoff exposed a cost of self-directed draft preparation:
      the email draft was prepared and went ahead without the user''s read, so the caveat
      he wanted was missing from the draft and he had to reconstruct what he meant to say.
      Reyes now has an earlier review window today, making the handoff acute.'
    opening: prior_state_change_or_repair
    activation:
      type: external_event
      detail: Prof. Reyes emails that her review window has moved up to this afternoon.
    coarse_task_phases:
    - phase_id: incident
      purpose: 'Register the loss from the earlier prepared email draft: the missing caveat
        forced the user to reconstruct the review instruction.'
    - phase_id: check_section_context
      purpose: Read the current section context so the handoff refers to the right material.
    - phase_id: policy_shift
      purpose: 'The user adopts Reactive handling: ask before preparing the substantive email
        draft, then wait for his caveat wording.'
    - phase_id: prepare_review_draft
      purpose: Create the review email draft using the approved section context and the user's
        dictated caveat.
    expected_domains:
    - documents
    - email
  probe:
    why_both_viable: Preparing an email draft is reversible and routine, so doing it without
      asking is plausible; the recent missing-caveat cost makes asking before that same internal
      draft action equally plausible and now preferred.
    preference_phase_ids:
    - policy_shift
    branches:
      correct:
        behavior: Asks before creating the substantive email draft and waits for the user's
          caveat wording before acting.
      wrong:
        behavior: Creates the substantive email draft first and reports that it has been prepared,
          using the same available facts and eventual wording.
    ingredient_objects:
    - ref: dictated_reyes_caveat
      role: gate
      store: email/drafts.jsonl
      record_id: null
      path: null
      task_fact: reyes_handoff_caveat_sentence
      field: null
      reveal_at: policy_shift
      note: 'Dictated at the probe beat, e.g.: "Tell him the caveat: the numbers in 3.2 are
        preliminary, the finite-size calculation is not done, and the notation in 3.3 is not
        settled yet."'
      gate_tool: email_draft_create
      gate_param: body
      gate_key_terms:
      - preliminary
      - calculation
      - notation
      gate_cue: his caveat wording
      gate_kind: dictated_text
      gate_slot: the caveat wording
    event_order:
      correct:
      - event: ask_before_email_draft
        phase_id: policy_shift
      wrong:
      - event: draft_before_permission
        phase_id: policy_shift
    contract_class: interaction_sequence
  identity:
    acc_num: 15
    session_type: evolving_event
    timeline_slot: work_autonomy_level
    target_cell: work_autonomy_level
  operational_source:
    attribute: autonomy_level
    settings:
    - Self-directed
    - Reactive
    contract_class: interaction_sequence
    operational_heading: Autonomy Level
