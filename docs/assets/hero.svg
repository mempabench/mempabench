<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 440" width="1640" height="440" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">MemPABench: Why Bother Me Again?</title>
  <desc id="hero-desc">Memory systems remember what you said, not how you want to be helped. Preference selection accuracy: Retrieval memory 50%, No memory 50%, File memory 59%, Oracle 99%.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAFF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <radialGradient id="glow-a" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="0.85" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#FBCFE8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4F46E5" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="0" y="0" width="1640" height="440" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1640" height="440" fill="url(#bg)"/>
    <rect width="1640" height="440" fill="url(#glow-a)"/>
    <rect width="1640" height="440" fill="url(#glow-b)"/>
    <rect width="1640" height="440" fill="url(#grid)"/>

    <!-- Eyebrow -->
    <text x="72" y="78" font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#5B6478">PERSONAL-ASSISTANT MEMORY BENCHMARK  •  4 USERS  •  99 SESSIONS  •  14 ATTRIBUTES × 2 CONTEXTS</text>

    <!-- Wordmark -->
    <text x="66" y="192" font-family="'Iowan Old Style',Palatino,'Palatino Linotype',Georgia,serif" font-size="112" font-weight="700" fill="#1E2240">MemPA<tspan fill="url(#accent)">Bench</tspan></text>

    <!-- Headline and tagline -->
    <text x="72" y="254" font-family="'Iowan Old Style',Palatino,'Palatino Linotype',Georgia,serif" font-size="44" font-style="italic" fill="#33385C">Why Bother Me Again?</text>
    <text font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#4A5068">
      <tspan x="72" y="306">Memory systems remember what you said,</tspan>
      <tspan x="72" y="342">not how you want to be helped.</tspan>
    </text>

    <!-- Example interaction preferences, coloured by the paper's four dimensions -->
    <g font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#2A2F4A">
      <g transform="translate(1004 112)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#14B8A6"/>
        <text x="44" y="31">Keep it short.</text>
      </g>
      <g transform="translate(1318 112)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#3B82F6"/>
        <text x="44" y="31">Skip the reasoning.</text>
      </g>
      <g transform="translate(1004 176)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#F59E0B"/>
        <text x="44" y="31">Check with me before you act.</text>
      </g>
      <g transform="translate(1318 176)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#F59E0B"/>
        <text x="44" y="31">Don't reach out unless I ask.</text>
      </g>
      <g transform="translate(1004 240)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#8B5CF6"/>
        <text x="44" y="31">Ask me everything up front.</text>
      </g>
      <g transform="translate(1318 240)">
        <rect width="298" height="50" rx="25" fill="#FFFFFF" stroke="#D9DEF0"/>
        <circle cx="26" cy="25" r="7" fill="#8B5CF6"/>
        <text x="44" y="31">One topic at a time.</text>
      </g>
    </g>

    <!-- Dimension legend -->
    <g font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#5B6478">
      <circle cx="1014" cy="315" r="6" fill="#14B8A6"/><text x="1028" y="321">Expression Style</text>
      <circle cx="1328" cy="315" r="6" fill="#3B82F6"/><text x="1342" y="321">Disclosure</text>
      <circle cx="1014" cy="343" r="6" fill="#F59E0B"/><text x="1028" y="349">Initiative &amp; Autonomy</text>
      <circle cx="1328" cy="343" r="6" fill="#8B5CF6"/><text x="1342" y="349">Information Flow</text>
    </g>

    <!-- Stat strip: preference selection accuracy (PSA) -->
    <rect x="0" y="372" width="1640" height="68" fill="#1E2240"/>
    <text x="820" y="414" text-anchor="middle" font-family="'Inter','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#E6E9FF"><tspan font-weight="700" letter-spacing="2" fill="#A5B4FC">PSA  </tspan>  Retrieval memory: 50%  ·  No memory: 50%  ·  <tspan font-weight="700" fill="#FFFFFF">File memory: 59%</tspan>  ·  Oracle: 99%</text>
  </g>
</svg>
